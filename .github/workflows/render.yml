name: render-book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # El libro no ejecuta código: no hace falta Python ni Jupyter.
      # Cuando exista el capítulo 08 habrá que agregar aquí setup-python
      # y la instalación de requirements.txt.
      - name: Renderizar HTML y PDF
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: all

      # Artefactos descargables: funcionan también con el repositorio privado
      # y sin Pages. El sitio se revisa bajando "sitio-html" y abriendo
      # index.html; el PDF se baja suelto.
      - name: Publicar el sitio como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sitio-html
          path: _book
          retention-days: 30

      - name: Publicar el PDF como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: libro-pdf
          path: _book/filosofia-de-la-ciencia.pdf
          retention-days: 30

      # GitHub Pages no está disponible para repositorios privados en el plan
      # gratuito. Este paso queda dormido hasta que se cree la variable de
      # repositorio PUBLICAR_PAGES con valor "true"
      # (Settings -> Secrets and variables -> Actions -> Variables).
      - name: Preparar artefacto de Pages
        if: vars.PUBLICAR_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PUBLICAR_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
